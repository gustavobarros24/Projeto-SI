---
- name: Generate Nginx site configuration
  template:
    src: nginx-medai.conf.j2
    dest: /etc/nginx/sites-available/medai
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable medai site
  file:
    src: /etc/nginx/sites-available/medai
    dest: /etc/nginx/sites-enabled/medai
    state: link
  notify: reload nginx

- name: Disable default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Validate Nginx configuration
  command: nginx -t
  changed_when: false
